name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - streamix-cryptography
          - streamix-data-masking
          - streamix-messaging
          - streamix-observability
          - streamix-web-commons
      version:
        description: 'Version to publish (blank = build.gradle version)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: "Publish to GitHub Packages"
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.package }}" = "all" ]; then
            TASK="publish"
          else
            TASK=":${{ inputs.package }}:publish"
          fi

          if [ -n "${{ inputs.version }}" ]; then
            ./gradlew $TASK -PreleaseVersion=${{ inputs.version }} --no-daemon
          else
            ./gradlew $TASK --no-daemon
          fi
